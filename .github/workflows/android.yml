name: Build Gabi IA APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar projeto (ZIP ou pasta)
        run: |
          set -e
          if [ -f gradlew ] && [ -d app ]; then
            echo "Projeto já está na raiz."
          elif [ -d AegisNexus-Android ] && [ -f AegisNexus-Android/gradlew ]; then
            echo "Projeto dentro de AegisNexus-Android — copiando para a raiz."
            cp -a AegisNexus-Android/. .
          else
            ZIP=$(ls -1 *.zip 2>/dev/null | head -1 || true)
            if [ -z "$ZIP" ]; then
              echo "Não achei projeto Android nem ZIP."
              ls -la
              exit 1
            fi
            echo "Encontrado ZIP: $ZIP — extraindo..."
            unzip -o "$ZIP" -d _extract
            if [ -f _extract/gradlew ]; then
              cp -a _extract/. .
            elif [ -d _extract/AegisNexus-Android ]; then
              cp -a _extract/AegisNexus-Android/. .
            else
              FOUND=$(find _extract -name gradlew -type f | head -1)
              if [ -n "$FOUND" ]; then
                DIR=$(dirname "$FOUND")
                cp -a "$DIR"/. .
              else
                echo "ZIP não contém gradlew."
                find _extract -maxdepth 3 -type f | head -50
                exit 1
              fi
            fi
          fi

          python3 - <<'PY'
          open('gradlew', 'w').write(
          '#!/bin/sh\n'
          'cd "$(dirname "$0")" || exit 1\n'
          'JAR="gradle/wrapper/gradle-wrapper.jar"\n'
          'if [ ! -f "$JAR" ]; then echo "gradle-wrapper.jar missing" >&2; exit 1; fi\n'
          'if [ -n "$JAVA_HOME" ] && [ -x "$JAVA_HOME/bin/java" ]; then JAVACMD="$JAVA_HOME/bin/java"; else JAVACMD="java"; fi\n'
          'exec "$JAVACMD" -Xmx64m -Xms64m -classpath "\( JAR" org.gradle.wrapper.GradleWrapperMain " \)@"\n'
          )
          PY
          chmod +x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          echo "gradlew OK"
          cat gradlew

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK (manual)
        run: |
          set -e
          ANDROID_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_
