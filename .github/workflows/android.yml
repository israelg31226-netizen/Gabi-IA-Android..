name: Build Gabi IA APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar projeto (ZIP ou pasta)
        run: |
          set -e
          if [ -f gradlew ] && [ -d app ]; then
            echo "Projeto já está na raiz."
          elif [ -d AegisNexus-Android ] && [ -f AegisNexus-Android/gradlew ]; then
            echo "Projeto dentro de AegisNexus-Android — copiando para a raiz."
            cp -a AegisNexus-Android/. .
          else
            ZIP=$(ls -1 *.zip 2>/dev/null | head -1 || true)
            if [ -z "$ZIP" ]; then
              echo "Não achei projeto Android nem ZIP."
              ls -la
              exit 1
            fi
            echo "Encontrado ZIP: $ZIP — extraindo..."
            unzip -o "$ZIP" -d _extract
            if [ -f _extract/gradlew ]; then
              cp -a _extract/. .
            elif [ -d _extract/AegisNexus-Android ]; then
              cp -a _extract/AegisNexus-Android/. .
            else
              FOUND=$(find _extract -name gradlew -type f | head -1)
              if [ -n "$FOUND" ]; then
                DIR=$(dirname "$FOUND")
                cp -a "$DIR"/. .
              else
                echo "ZIP não contém gradlew."
                find _extract -maxdepth 3 -type f | head -50
                exit 1
              fi
            fi
          fi

          # Reescreve gradlew (o do ZIP tinha aspas quebradas)
          printf '%s\n' \
            '#!/bin/sh' \
            'DIR=\( (CDPATH= cd -- " \)(dirname "$0")" && pwd)' \
            'JAR="$DIR/gradle/wrapper/gradle-wrapper.jar"' \
            'if [ ! -f "$JAR" ]; then echo "gradle-wrapper.jar missing" >&2; exit 1; fi' \
            'if [ -n "$JAVA_HOME" ] && [ -x "$JAVA_HOME/bin/java" ]; then JAVACMD="$JAVA_HOME/bin/java"; else JAVACMD=java; fi' \
            'exec "$JAVACMD" -Xmx64m -Xms64m -classpath "\( JAR" org.gradle.wrapper.GradleWrapperMain " \)@"' \
            > gradlew
          chmod +x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          echo "gradlew OK"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK (manual)
        run: |
          set -e
          ANDROID_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_ROOT/cmdline-tools"
          if [ -d "$ANDROID_ROOT/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_ROOT/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Gabi-IA-v15.30-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
